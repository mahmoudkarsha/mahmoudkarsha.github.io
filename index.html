<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahmoud Abdulbari Karsha — Software Engineer</title>
    <meta
      name="description"
      content="Mahmoud Abdulbari Karsha — Software Engineer specializing in full-stack development, backend systems, and infrastructure."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#fdfdfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css" />
    <script src="content.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="spotlight" aria-hidden="true"></div>
    <nav class="topbar" aria-label="Sections">
      <div class="topbar-inner">
        <a class="brand" href="#top">M. A. Karsha</a>
        <div class="topbar-actions">
        <div class="nav-links">
          <a href="#about">About</a>
          <a href="#experience-section">Experience</a>
          <a href="#skills-section">Skills</a>
          <a href="#projects-section">Projects</a>
          <a href="#education-section">Education</a>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="btn" href="cv.pdf" download="Mahmoud_Abdulbari_Karsha_CV.pdf">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Download CV</span>
        </a>
        </div>
      </div>
    </nav>
    <main class="page" id="top">

          <ul id="contact" class="contact"></ul>

      <section class="section" id="about">

          <span class="section-num">01</span>
          <h2>About</h2>
        </header>
        <div class="section-body">
          <p id="summary" class="lead"></p>
        </div>
      </section>

      <section class="section" id="experience-section">
        <header class="section-head">
          <span class="section-num">02</span>
          <h2>Experience</h2>
        </header>
        <div id="experience" class="section-body timeline"></div>
      </section>

      <section class="section" id="skills-section">
        <header class="section-head">
          <span class="section-num">03</span>
          <h2>Skills</h2>

      <section class="section" id="projects-section">

          <span class="section-num">04</span>
          <h2>Projects</h2>
        </header>

      <section class="section" id="education-section">

          <span class="section-num">05</span>

      <section class="section" id="languages-section">

          <span class="section-num">06</span>
          <h2>Languages</h2>
        </header>
        <ul id="languages" class="section-body languages"></ul>
      </section>

      <section class="section" id="certificates-section">
        <header class="section-head">
          <span class="section-num">07</span>
          <h2>Certificates</h2>

      <footer class="footer">© <span id="year"></span> Mahmoud Abdulbari Karsha</footer>
