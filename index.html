<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahmoud Abdulbari Karsha — Software Engineer</title>
    <meta
      name="description"
      content="Mahmoud Abdulbari Karsha — Software Engineer specializing in full-stack development, backend systems, and infrastructure."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="content.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <!-- Header -->
      <header class="hero">
        <img id="avatar" class="avatar" alt="Portrait of Mahmoud Abdulbari Karsha" width="112" height="112" />
        <div class="hero-text">
          <h1 id="name"></h1>
          <p class="role">Software Engineer</p>
          <ul id="contact" class="contact"></ul>
        </div>
        <a class="btn" href="cv.pdf" download="Mahmoud_Abdulbari_Karsha_CV.pdf">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Download CV
        </a>
      </header>

      <section class="section">
        <h2>About</h2>
        <div class="section-body">
          <p id="summary" class="lead"></p>
        </div>
      </section>

      <section class="section">
        <h2>Experience</h2>
        <div id="experience" class="section-body timeline"></div>
      </section>

      <section class="section">
        <h2>Skills</h2>
        <dl id="skills" class="section-body skills"></dl>
      </section>

      <section class="section">
        <h2>Projects</h2>
        <div id="projects" class="section-body projects"></div>
      </section>

      <section class="section">
        <h2>Education</h2>
        <div id="education" class="section-body"></div>
      </section>

      <section class="section">
        <h2>Languages</h2>
        <ul id="languages" class="section-body languages"></ul>
      </section>

      <section class="section">
        <h2>Certificates</h2>
        <ul id="certificates" class="section-body list"></ul>
      </section>

      <footer class="footer">© <span id="year"></span> Mahmoud Abdulbari Karsha</footer>
    </main>
  </body>
</html>
