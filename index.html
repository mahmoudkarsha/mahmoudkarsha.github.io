<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahmoud Abdulbari Karsha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="content.js"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-gray-800 font-sans">
    <div class="max-w-5xl mx-auto px-6 py-10">
      <!-- Header -->
      <div class="flex flex-col md:flex-row items-center gap-6 border-b pb-8">
        <img class="w-32 h-32 rounded-lg object-cover border" />
        <div class="text-center md:text-left">
          <h1 class="text-3xl font-bold"></h1>
          <p class="text-gray-600 mt-2"></p>
        </div>
      </div>

      <!-- Sections Wrapper -->
      <div class="grid md:grid-cols-1 gap-8 mt-10">
        <!-- Left -->
        <div class="space-y-8">
          <!-- Summary -->
          <div class="bg-gray-50 p-5 rounded-xl shadow-sm">
            <h2 class="font-semibold text-lg mb-2">Professional Summary</h2>
            <p class="text-sm leading-relaxed summary"></p>
          </div>

          <!-- Skills -->
          <div class="bg-gray-50 p-5 rounded-xl shadow-sm">
            <h2 class="font-semibold text-lg mb-3">Technical Skills</h2>
            <div class="text-sm space-y-1 skills"></div>
          </div>

          <!-- Experience -->
          <div class="bg-gray-50 p-5 rounded-xl shadow-sm">
            <h2 class="font-semibold text-lg mb-3">Professional Experience</h2>
            <div class="experience"></div>
          </div>

          <!-- Projects -->
          <div class="bg-gray-50 p-5 rounded-xl shadow-sm">
            <h2 class="font-semibold text-lg mb-2">Projects</h2>
            <ul class="text-sm space-y-2 projects"></ul>
          </div>
          <!-- Education -->
          <div class="bg-gray-50 p-5 rounded-xl shadow-sm">
            <h2 class="font-semibold text-lg mb-2">Education</h2>
            <p class="text-sm education"></p>
          </div>
          <!-- Languages -->
          <div class="bg-gray-50 p-5 rounded-xl shadow-sm">
            <h2 class="font-semibold text-lg mb-2">Languages</h2>
            <ul class="text-sm space-y-1 languages"></ul>
          </div>
          <!-- Certificates -->
          <div class="bg-gray-50 p-5 rounded-xl shadow-sm">
            <h2 class="font-semibold text-lg mb-2">Certificates</h2>
            <ul class="text-sm space-y-1 certificates"></ul>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center text-xs text-gray-400 mt-10">© 2026 Mahmoud Abdulbari Karsha</div>
    </div>
  </body>
</html>
